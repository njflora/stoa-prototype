# Checks every push and pull request: the site passes lint and the format
# check, type-checks and builds; the back end passes Pint and Larastan and
# its tests pass; and no installed package has a known security problem.
# Actions are pinned to exact commits, as in deploy.yml.
name: Checks

on:
  push:
    branches: [main, refine]
  pull_request:

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Style and lint first, so a problem there fails fast.
      - run: npm run format:check
      - run: npm run lint
      - run: npm run build:pages
      # Fails on high or critical problems in any package.
      - run: npm audit --audit-level=high

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: pdo_sqlite
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      # Style, then static analysis: level 8 everywhere, the strictest level
      # for the access-critical code (docs/decisions/0001).
      - run: composer lint
      - run: composer analyse
      - run: composer analyse:access
      # The tests use an in-memory database and in-memory search (phpunit.xml).
      - run: php artisan test
      - run: composer audit
